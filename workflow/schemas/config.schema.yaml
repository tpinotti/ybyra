$schema: "https://json-schema.org/draft/2020-12/schema"
description: ybyra config file, see config/config.yaml for details.
type: object

$defs:
  ref_data_block:
    type: object
    properties:
      chrom:
        type: string
      snps:
        type: string
      info:
        type: string
      tree:
        type: string
    required: [chrom, snps, info, tree]
    additionalProperties: false

properties:
  units:
    type: string
  ref_genome:
    type: string
  ref_data:
    type: string
    enum: [custom, hg37_ftdna, hg37_isogg, hg37_yfull, hg38_ftdna, hg38_isogg, hg38_yfull]
  lib_type:
    type: string
    enum: [ds, ss, both]
  damage_filter:
    type: boolean
  damage_model:
    type: string
    enum: [naive, uni, bi]
  prefix:
    type: string
  MQ:
    type: integer
    minimum: 0
  BQ:
    type: integer
    minimum: 0
  min_majority_fraction:
    type: number
    minimum: 0
    maximum: 1
  step_size:
    type: integer
    minimum: 0
  min_tree_score:
    type: integer
  low_tree_score:
    type: integer
  step_size_exploration:
    type: boolean
  step_size_exploration_baseline:
    type: string
    enum: [step_size, "off"]
  step_size_exploration_max:
    type: integer
    minimum: 1
  custom:
    $ref: "#/$defs/ref_data_block"
  hg37_ftdna:
    $ref: "#/$defs/ref_data_block"
  hg37_isogg:
    $ref: "#/$defs/ref_data_block"
  hg37_yfull:
    $ref: "#/$defs/ref_data_block"
  hg38_ftdna:
    $ref: "#/$defs/ref_data_block"
  hg38_isogg:
    $ref: "#/$defs/ref_data_block"
  hg38_yfull:
    $ref: "#/$defs/ref_data_block"

required:
  - units
  - ref_genome
  - ref_data
  - lib_type
  - damage_filter
  - damage_model
  - prefix
  - MQ
  - BQ
  - min_majority_fraction
  - step_size
  - min_tree_score
  - low_tree_score
  - step_size_exploration
  - step_size_exploration_baseline
  - step_size_exploration_max
additionalProperties: false
